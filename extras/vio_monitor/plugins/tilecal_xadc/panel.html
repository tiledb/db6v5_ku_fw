<div class="monitor-bar">
  <label>Sample
    <select id="pollRate-tilecal_xadc" data-poll-rate="tilecal_xadc">
      <option value="off" selected>Off</option>
      <option value="0">0s (continuous)</option>
      <option value="1">1s</option>
      <option value="2">2s</option>
      <option value="3">3s</option>
      <option value="4">4s</option>
      <option value="5">5s</option>
      <option value="10">10s</option>
    </select>
  </label>
  <button type="button" data-refresh="tilecal_xadc">Refresh</button>
  <span id="time-tilecal_xadc"></span>
  <span id="live-tilecal_xadc" class="live-scan-hint"></span>
</div>
<div id="tilecalBody" class="tilecal-split">
  <div id="wrap-tilecal_xadc" class="tilecal-table-panel">
    <div id="tilecal-table-wrap">
      <p class="empty">Connect and open a target to view TileCal xADC conversions.</p>
    </div>
  </div>
  <div id="tilecalPlotsWrap" class="tilecal-plots-panel">
    <div class="tilecal-plot-box corr">
      <h3>Temperature vs 0.95V current</h3>
      <div class="tilecal-canvas-wrap"><canvas id="tilecalCorrChart"></canvas></div>
    </div>
    <div class="tilecal-plot-box current">
      <h3>Monitor currents</h3>
      <div class="tilecal-canvas-wrap"><canvas id="tilecalCurrentChart"></canvas></div>
    </div>
  </div>
</div>
