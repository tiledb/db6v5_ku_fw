<div class="monitor-bar">
  <label>Sample
    <select id="pollRate-vio" data-poll-rate="vio">
      <option value="off" selected>Off</option>
      <option value="0">0s (continuous)</option>
      <option value="1">1s</option>
      <option value="2">2s</option>
      <option value="3">3s</option>
      <option value="4">4s</option>
      <option value="5">5s</option>
      <option value="10">10s</option>
    </select>
  </label>
  <button type="button" data-refresh="vio">Refresh</button>
  <span id="time-vio"></span>
</div>
<div id="wrap-vio" class="panel-scroll"><p class="empty">Connect and open a target to monitor VIO probes.</p></div>
