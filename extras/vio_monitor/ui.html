<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HW Monitor</title>
<link rel="stylesheet" href="/static/core.css">
</head>
<body>

<header>
  <h1>HW Monitor</h1>
  <div style="display:flex;align-items:center;gap:.5rem">
    <button type="button" class="btn-icon" title="Plugin configuration" onclick="openConfigModal()">⚙</button>
    <div id="statusBar">Ready</div>
  </div>
</header>

<div class="toolbar toolbar-connect">
  <div class="field">
    <label>Vivado</label>
    <select id="selVivado" onchange="selectVivado()"></select>
  </div>
  <div class="field grow">
    <label>Server</label>
    <div style="display:flex;gap:.25rem">
      <select id="selServer" onchange="onServerChange()" style="flex:1;max-width:160px"></select>
      <input type="text" id="serverUrl" placeholder="host:port" style="flex:2">
    </div>
  </div>
  <div class="field">
    <label>Target</label>
    <select id="selTarget" onchange="onTargetChange()"><option value="">—</option></select>
  </div>
  <div class="field">
    <label>Device</label>
    <select id="selDevice" onchange="onDeviceChange()"><option value="">—</option></select>
  </div>
  <div class="toolbar-actions">
    <button class="primary" onclick="connectFlow()">Connect</button>
    <button onclick="refreshAll()">Refresh all</button>
    <button class="danger" onclick="disconnect()">Disconnect</button>
  </div>
</div>

<div class="toolbar toolbar-files">
  <div class="file-group">
    <div class="file-group-head">
      <label>Probes file (.ltx)</label>
      <div class="file-group-tools">
        <button type="button" class="btn-icon" title="Refresh file list" onclick="refreshFileList('ltx')">↻</button>
        <button type="button" class="btn-icon" title="Upload .ltx" onclick="triggerUpload('ltx')">↑</button>
        <input type="file" id="uploadLtx" accept=".ltx" hidden onchange="uploadFile('ltx', this)">
      </div>
    </div>
    <select id="ltxSelect" onchange="onFileSelect('ltx')">
      <option value="">— pick .ltx file —</option>
    </select>
    <div class="file-group-row">
      <input type="text" id="ltxPath" placeholder="absolute path to .ltx">
      <button id="btnLoadLtx" onclick="applyLtx()">Load LTX</button>
    </div>
  </div>
  <div class="file-group">
    <div class="file-group-head">
      <label>Bitstream (.bit)</label>
      <div class="file-group-tools">
        <button type="button" class="btn-icon" title="Refresh file list" onclick="refreshFileList('bit')">↻</button>
        <button type="button" class="btn-icon" title="Upload .bit" onclick="triggerUpload('bit')">↑</button>
        <input type="file" id="uploadBit" accept=".bit" hidden onchange="uploadFile('bit', this)">
      </div>
    </div>
    <select id="bitSelect" onchange="onFileSelect('bit')">
      <option value="">— pick .bit file —</option>
    </select>
    <div class="file-group-row">
      <input type="text" id="bitPath" placeholder="absolute path to .bit">
      <button id="btnProgramBit" onclick="programBit()">Program .bit</button>
    </div>
  </div>
  <div class="file-group">
    <div class="file-group-head">
      <label>Flash image (.bin)</label>
      <div class="file-group-tools">
        <button type="button" class="btn-icon" title="Refresh file list" onclick="refreshFileList('bin')">↻</button>
        <button type="button" class="btn-icon" title="Upload .bin" onclick="triggerUpload('bin')">↑</button>
        <input type="file" id="uploadBin" accept=".bin" hidden onchange="uploadFile('bin', this)">
      </div>
    </div>
    <select id="binSelect" onchange="onFileSelect('bin')">
      <option value="">— pick .bin file —</option>
    </select>
    <div class="file-group-row">
      <input type="text" id="binPath" placeholder="absolute path to .bin">
      <button id="btnProgramBin" onclick="programBin()">Program .bin</button>
    </div>
  </div>
</div>

<div class="main">
  <aside class="sidebar">
    <h2>Hardware tree</h2>
    <div id="hwTree"><p class="empty">Not connected</p></div>
  </aside>

  <section class="content">
    <div id="pluginTabs" class="tabs"></div>
    <div id="pluginPanels"></div>
  </section>
</div>

<div class="terminal-wrap">
  <div class="terminal-head" id="termHead" onclick="toggleTerminal()">
    <span id="termArrow">▾</span> Tcl console <span id="termHint"></span>
  </div>
  <div class="terminal-body open" id="termBody">
    <div id="terminal"></div>
    <div id="termInputRow"><span>vivado%</span><input type="text" id="termInput" placeholder="Tcl command…"></div>
  </div>
</div>

<div id="configModal" class="modal">
  <div class="modal-backdrop" onclick="closeConfigModal()"></div>
  <div class="modal-panel">
    <div class="modal-head">
      <h2>Configuration</h2>
      <button type="button" class="btn-icon" onclick="closeConfigModal()">✕</button>
    </div>
    <div class="modal-body">
      <h3 class="modal-section">Plugins</h3>
      <p class="modal-hint">Enable or disable tabs. Each plugin lives in its own folder under <code>plugins/</code>.</p>
      <div id="pluginConfigList"></div>
    </div>
    <div class="modal-foot">
      <button onclick="closeConfigModal()">Cancel</button>
      <button class="primary" onclick="savePluginConfig()">Save &amp; reload</button>
    </div>
  </div>
</div>

<script>window.INITIAL_CONFIG = {{ initial_config | safe }};</script>
<script src="/static/core.js"></script>
</body>
</html>
