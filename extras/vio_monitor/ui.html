<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HW Monitor</title>
<style>
  :root {
    --bg: #0c1220;
    --panel: #151d2e;
    --panel2: #1c2740;
    --border: #2a3654;
    --text: #e8edf5;
    --muted: #8b9bb4;
    --accent: #4f8cff;
    --accent2: #3ecf8e;
    --warn: #f0b429;
    --err: #ff6b6b;
    --in: #5eead4;
    --out: #fdba74;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 13px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  header { display: flex; align-items: center; justify-content: space-between; padding: .45rem .75rem; background: var(--panel); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  header h1 { font-size: .95rem; font-weight: 600; color: var(--accent); letter-spacing: .02em; }
  #statusBar { font-size: .78rem; color: var(--muted); max-width: 55vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #statusBar.err { color: var(--err); }

  .toolbar { display: flex; flex-wrap: wrap; gap: .35rem .5rem; align-items: flex-end; padding: .45rem .75rem; background: var(--panel2); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .toolbar-connect { align-items: center; }
  .toolbar-actions { display: flex; gap: .35rem; margin-left: auto; flex-shrink: 0; }
  .toolbar-files { gap: .55rem; padding-top: .35rem; padding-bottom: .5rem; border-top: 1px dashed var(--border); }
  .file-group { flex: 1; min-width: 240px; display: flex; flex-direction: column; gap: .2rem; padding: .4rem .55rem; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; }
  .file-group-head { display: flex; align-items: center; justify-content: space-between; gap: .35rem; }
  .file-group-head label { margin: 0; }
  .file-group-tools { display: flex; gap: .25rem; flex-shrink: 0; }
  button.btn-icon { padding: .18rem .45rem; font-size: .82rem; line-height: 1; min-width: 1.6rem; }
  .file-group label { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .file-group select, .file-group input[type=text] { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: .28rem .45rem; font-size: .72rem; width: 100%; min-width: 0; }
  .file-group select optgroup { font-weight: 600; font-style: normal; }
  .file-group-row { display: flex; gap: .35rem; align-items: center; }
  .file-group-row input { flex: 1; }
  .file-group-row button { flex-shrink: 0; }
  .toolbar label { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .field { display: flex; flex-direction: column; gap: .15rem; min-width: 0; }
  .field select, .field input[type=text] { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: .28rem .45rem; font-size: .78rem; max-width: 220px; }
  .field.wide input { max-width: 340px; min-width: 200px; }
  .field.grow { flex: 1; }
  .field select:disabled, .field input:disabled { opacity: 0.45; cursor: not-allowed; }

  button, .btn { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: .32rem .6rem; font-size: .78rem; cursor: pointer; white-space: nowrap; }
  button:hover, .btn:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { filter: brightness(1.1); color: #fff; }
  button.danger { border-color: #7f1d1d; color: #fca5a5; }

  .main { display: flex; flex: 1; min-height: 0; }
  .sidebar { width: 240px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .sidebar h2 { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: .5rem .65rem .25rem; }
  #hwTree { flex: 1; overflow: auto; padding: .25rem .35rem .5rem; font-size: .78rem; }
  .tree-node { padding: .2rem .35rem; border-radius: 3px; cursor: pointer; display: flex; align-items: center; gap: .3rem; color: var(--muted); }
  .tree-node:hover { background: var(--panel2); color: var(--text); }
  .tree-node.active { background: #243352; color: var(--accent); }
  .tree-node .icon { width: 1rem; text-align: center; flex-shrink: 0; }
  .tree-node.vivado { color: var(--accent); font-weight: 600; }
  .tree-node.server { padding-left: .75rem; color: var(--accent2); font-weight: 600; }
  .tree-node.target { padding-left: 1.4rem; }
  .tree-node.device { padding-left: 2rem; }
  .tree-node.vio, .tree-node.sysmon { padding-left: 2.6rem; font-size: .74rem; }

  .content { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .tabs { display: flex; gap: .15rem; padding: .35rem .5rem 0; background: var(--panel2); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .tab { padding: .35rem .75rem; font-size: .78rem; color: var(--muted); cursor: pointer; border-radius: 4px 4px 0 0; border: 1px solid transparent; border-bottom: none; }
  .tab.active { background: var(--bg); color: var(--text); border-color: var(--border); }
  .tab-panel { display: none; flex: 1; flex-direction: column; overflow: hidden; padding: .5rem .65rem; min-height: 0; }
  .tab-panel.active { display: flex; }

  .monitor-bar { display: flex; align-items: center; gap: .5rem; margin-bottom: .45rem; font-size: .75rem; color: var(--muted); flex-shrink: 0; }
  .monitor-bar select { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: .15rem .35rem; font-size: .72rem; }
  .panel-scroll { flex: 1; min-height: 0; overflow: auto; }
  table.data { width: 100%; border-collapse: collapse; font-size: .78rem; }
  table.data th, table.data td { border: 1px solid var(--border); padding: .28rem .45rem; text-align: left; }
  table.data th { background: var(--panel2); color: var(--muted); font-weight: 600; position: sticky; top: 0; z-index: 1; }
  table.data tr.group td { background: var(--panel2); font-weight: 600; color: var(--accent); }
  .dir-IN { color: var(--in); }
  .dir-OUT { color: var(--out); }
  tr.val-changed td, td.val-changed { animation: flash .5s ease; }
  @keyframes flash { from { background: #4a5f20; } to { background: transparent; } }
  td.act-live { color: var(--accent2); font-weight: 600; }
  td.act-idle { color: var(--muted); }

  .xadc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: .45rem; }
  .xadc-highlight { background: #1a2740; }
  .xadc-highlight td.value { color: var(--accent2); font-weight: 600; font-family: var(--mono); }
  .xadc-highlight.temp td.value { color: var(--warn); }

  .xadc-split { flex: 1; min-height: 0; display: flex; gap: .55rem; overflow: hidden; }
  .xadc-table-panel { flex: 1; min-width: 0; min-height: 0; overflow: auto; }
  .xadc-plots-panel { width: 44%; min-width: 300px; max-width: 520px; flex-shrink: 0; display: flex; flex-direction: column; gap: .45rem; min-height: 0; }
  .xadc-plot-box { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: .4rem .5rem .35rem; }
  .xadc-plot-box h3 { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: .2rem; flex-shrink: 0; }
  .xadc-plot-box.temp h3 { color: var(--warn); }
  .xadc-plot-box.volt h3 { color: var(--accent2); }
  .xadc-canvas-wrap { flex: 1; min-height: 100px; position: relative; }
  .xadc-section-title { font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: .55rem 0 .3rem; }
  .xadc-section-title:first-child { margin-top: 0; }
  .xadc-table-panel table.data { margin-bottom: .25rem; }

  .xadc-card { background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: .5rem .6rem; }
  .xadc-card .label { font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .xadc-card .value { font-size: 1.05rem; font-weight: 600; margin-top: .15rem; font-family: var(--mono); }
  .xadc-card.temp .value { color: var(--warn); }
  .xadc-card.volt .value { color: var(--accent2); }

  .empty { color: var(--muted); font-style: italic; padding: 1rem 0; }

  .terminal-wrap { flex-shrink: 0; border-top: 1px solid var(--border); background: var(--panel); }
  .terminal-head { display: flex; align-items: center; justify-content: space-between; padding: .3rem .65rem; cursor: pointer; font-size: .75rem; color: var(--muted); }
  .terminal-body { display: none; padding: 0 .65rem .45rem; }
  .terminal-body.open { display: block; }
  #terminal { background: #060a10; color: #8f8; font-family: var(--mono); font-size: .72rem; height: 140px; overflow-y: auto; padding: .4rem; border-radius: 4px; border: 1px solid var(--border); }
  #terminal .term-cmd { color: #6cf; }
  #terminal .term-out { color: #bbb; white-space: pre-wrap; }
  #terminal .term-err { color: var(--err); white-space: pre-wrap; }
  #termInputRow { display: flex; gap: .4rem; margin-top: .3rem; align-items: center; }
  #termInput { flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: .25rem .4rem; font-family: var(--mono); font-size: .72rem; }
</style>
</head>
<body>

<header>
  <h1>HW Monitor</h1>
  <div id="statusBar">Ready</div>
</header>

<div class="toolbar toolbar-connect">
  <div class="field">
    <label>Vivado</label>
    <select id="selVivado" onchange="selectVivado()"></select>
  </div>
  <div class="field grow">
    <label>Server</label>
    <div style="display:flex;gap:.25rem">
      <select id="selServer" onchange="onServerChange()" style="flex:1;max-width:160px"></select>
      <input type="text" id="serverUrl" placeholder="host:port" style="flex:2">
    </div>
  </div>
  <div class="field">
    <label>Target</label>
    <select id="selTarget" onchange="onTargetChange()"><option value="">—</option></select>
  </div>
  <div class="field">
    <label>Device</label>
    <select id="selDevice" onchange="onDeviceChange()"><option value="">—</option></select>
  </div>
  <div class="toolbar-actions">
    <button class="primary" onclick="connectFlow()">Connect</button>
    <button onclick="refreshAll()">Refresh all</button>
    <button class="danger" onclick="disconnect()">Disconnect</button>
  </div>
</div>

<div class="toolbar toolbar-files">
  <div class="file-group">
    <div class="file-group-head">
      <label>Probes file (.ltx)</label>
      <div class="file-group-tools">
        <button type="button" class="btn-icon" title="Refresh file list" onclick="refreshFileList('ltx')">↻</button>
        <button type="button" class="btn-icon" title="Upload .ltx" onclick="triggerUpload('ltx')">↑</button>
        <input type="file" id="uploadLtx" accept=".ltx" hidden onchange="uploadFile('ltx', this)">
      </div>
    </div>
    <select id="ltxSelect" onchange="onFileSelect('ltx')">
      <option value="">— pick .ltx file —</option>
    </select>
    <div class="file-group-row">
      <input type="text" id="ltxPath" placeholder="absolute path to .ltx">
      <button id="btnLoadLtx" onclick="applyLtx()">Load LTX</button>
    </div>
  </div>
  <div class="file-group">
    <div class="file-group-head">
      <label>Bitstream (.bit)</label>
      <div class="file-group-tools">
        <button type="button" class="btn-icon" title="Refresh file list" onclick="refreshFileList('bit')">↻</button>
        <button type="button" class="btn-icon" title="Upload .bit" onclick="triggerUpload('bit')">↑</button>
        <input type="file" id="uploadBit" accept=".bit" hidden onchange="uploadFile('bit', this)">
      </div>
    </div>
    <select id="bitSelect" onchange="onFileSelect('bit')">
      <option value="">— pick .bit file —</option>
    </select>
    <div class="file-group-row">
      <input type="text" id="bitPath" placeholder="absolute path to .bit">
      <button id="btnProgramBit" onclick="programBit()">Program .bit</button>
    </div>
  </div>
  <div class="file-group">
    <div class="file-group-head">
      <label>Flash image (.bin)</label>
      <div class="file-group-tools">
        <button type="button" class="btn-icon" title="Refresh file list" onclick="refreshFileList('bin')">↻</button>
        <button type="button" class="btn-icon" title="Upload .bin" onclick="triggerUpload('bin')">↑</button>
        <input type="file" id="uploadBin" accept=".bin" hidden onchange="uploadFile('bin', this)">
      </div>
    </div>
    <select id="binSelect" onchange="onFileSelect('bin')">
      <option value="">— pick .bin file —</option>
    </select>
    <div class="file-group-row">
      <input type="text" id="binPath" placeholder="absolute path to .bin">
      <button id="btnProgramBin" onclick="programBin()">Program .bin</button>
    </div>
  </div>
</div>

<div class="main">
  <aside class="sidebar">
    <h2>Hardware tree</h2>
    <div id="hwTree"><p class="empty">Not connected</p></div>
  </aside>

  <section class="content">
    <div class="tabs">
      <div class="tab active" data-tab="vio" onclick="switchTab('vio')">VIO Probes</div>
      <div class="tab" data-tab="xadc" onclick="switchTab('xadc')">System Monitor</div>
      <div class="tab" data-tab="props" onclick="switchTab('props')">Properties</div>
    </div>

    <div id="panelVio" class="tab-panel active">
      <div class="monitor-bar">
        <label>Sample
          <select id="pollRateVio" onchange="syncPollers()">
            <option value="off" selected>Off</option>
            <option value="0">0s (continuous)</option>
            <option value="1">1s</option>
            <option value="2">2s</option>
            <option value="3">3s</option>
            <option value="4">4s</option>
            <option value="5">5s</option>
            <option value="10">10s</option>
          </select>
        </label>
        <button onclick="refreshViosOnly()">Refresh</button>
        <span id="vioTime"></span>
      </div>
      <div id="vioWrap" class="panel-scroll"><p class="empty">Connect and open a target to monitor VIO probes.</p></div>
    </div>
    <div id="panelXadc" class="tab-panel">
      <div class="monitor-bar">
        <label>Sample
          <select id="pollRateXadc" onchange="syncPollers()">
            <option value="off" selected>Off</option>
            <option value="0">0s (continuous)</option>
            <option value="1">1s</option>
            <option value="2">2s</option>
            <option value="3">3s</option>
            <option value="4">4s</option>
            <option value="5">5s</option>
            <option value="10">10s</option>
          </select>
        </label>
        <button onclick="refreshXadcOnly()">Refresh</button>
        <span id="xadcTime"></span>
      </div>
      <div id="xadcBody" class="xadc-split">
        <div id="xadcTableWrap" class="xadc-table-panel">
          <p class="empty">XADC readings appear after a device is selected.</p>
        </div>
        <div id="xadcPlotsWrap" class="xadc-plots-panel">
          <div class="xadc-plot-box temp">
            <h3>Temperature</h3>
            <div class="xadc-canvas-wrap"><canvas id="xadcTempChart"></canvas></div>
          </div>
          <div class="xadc-plot-box volt">
            <h3>Voltage</h3>
            <div class="xadc-canvas-wrap"><canvas id="xadcVoltChart"></canvas></div>
          </div>
        </div>
      </div>
    </div>
    <div id="panelProps" class="tab-panel">
      <div class="monitor-bar">
        <label>Sample
          <select id="pollRateProps" onchange="syncPollers()">
            <option value="off" selected>Off</option>
            <option value="0">0s (continuous)</option>
            <option value="1">1s</option>
            <option value="2">2s</option>
            <option value="3">3s</option>
            <option value="4">4s</option>
            <option value="5">5s</option>
            <option value="10">10s</option>
          </select>
        </label>
        <button onclick="refreshPropertiesOnly()">Refresh</button>
        <span id="propsTime"></span>
      </div>
      <div id="propsWrap" class="panel-scroll"><p class="empty">Select a device to view properties.</p></div>
    </div>
  </section>
</div>

<div class="terminal-wrap">
  <div class="terminal-head" id="termHead" onclick="toggleTerminal()"><span id="termArrow">▾</span> Tcl console <span id="termHint"></span></div>
  <div class="terminal-body open" id="termBody">
    <div id="terminal"></div>
    <div id="termInputRow"><span>vivado%</span><input type="text" id="termInput" placeholder="Tcl command…"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script>
const INITIAL_CONFIG = {{ initial_config | safe }};
let state = {
  servers: INITIAL_CONFIG.hw_servers || [],
  targets: [],
  devices: [],
  serverUrl: INITIAL_CONFIG.last_connected || '',
  target: INITIAL_CONFIG.last_target || '',
  device: INITIAL_CONFIG.last_device || '',
  connected: false,
  targetOpen: false,
  activeTab: 'vio',
};
let pollTimers = { vio: null, xadc: null, props: null };
let pollLoops = { vio: null, xadc: null, props: null };
let pollBusy = { vio: false, xadc: false, props: false };
const POLL_SELECT = { vio: 'pollRateVio', xadc: 'pollRateXadc', props: 'pollRateProps' };
let lastVioValues = {};
let lastXadcValues = {};
let lastPropValues = {};
let xadcCharts = { temp: null, volt: null };
let xadcHist = { temp: {}, volt: {} };
let xadcLegendFilter = { temp: null, volt: null };
const XADC_HIST_MAX = 120;
const XADC_PLOT_COLORS = [
  '#f0b429', '#4f8cff', '#3ecf8e', '#ff6b6b', '#5eead4', '#fdba74',
  '#c084fc', '#f472b6', '#a3e635', '#38bdf8', '#fb923c', '#e879f9',
];
let consoleCursor = 0;
let tclHistory = [];
let tclHistPos = -1;
let tclDraft = '';

function setStatus(msg, isErr) {
  const el = document.getElementById('statusBar');
  el.textContent = msg;
  el.className = isErr ? 'err' : '';
}

function shortName(full) {
  if (!full) return '';
  const p = full.split('/');
  return p[p.length - 1] || full;
}

function switchTab(name) {
  state.activeTab = name;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel' + name.charAt(0).toUpperCase() + name.slice(1)).classList.add('active');
  if (name === 'props') {
    if (!state.targetOpen) {
      document.getElementById('propsWrap').innerHTML =
        '<p class="empty">Open a target and select a device first.</p>';
      return;
    }
    if (!state.device) {
      document.getElementById('propsWrap').innerHTML =
        '<p class="empty">Select a device to view properties.</p>';
      return;
    }
    loadProperties(state.device);
  }
  if (name === 'xadc') {
    requestAnimationFrame(() => {
      if (xadcCharts.temp) xadcCharts.temp.resize();
      if (xadcCharts.volt) xadcCharts.volt.resize();
    });
  }
}

function toggleTerminal() {
  const body = document.getElementById('termBody');
  body.classList.toggle('open');
  document.getElementById('termArrow').textContent = body.classList.contains('open') ? '▾' : '▸';
}

function updateTermHeadHint(text) {
  document.getElementById('termHint').textContent = text;
}

// ---- dropdowns ----
function fillServerSelect() {
  const sel = document.getElementById('selServer');
  const cur = state.serverUrl;
  sel.innerHTML = '<option value="">— custom —</option>';
  for (const s of state.servers) {
    const opt = document.createElement('option');
    opt.value = s.url;
    opt.textContent = (s.name ? s.name + ' · ' : '') + s.url;
    if (s.url === cur) opt.selected = true;
    sel.appendChild(opt);
  }
  if (cur && !state.servers.some(s => s.url === cur)) {
    const opt = document.createElement('option');
    opt.value = cur; opt.textContent = cur; opt.selected = true;
    sel.appendChild(opt);
  }
  document.getElementById('serverUrl').value = cur || '';
}

function fillTargetSelect() {
  const sel = document.getElementById('selTarget');
  sel.innerHTML = '<option value="">— select —</option>';
  for (const t of state.targets) {
    const opt = document.createElement('option');
    opt.value = t;
    opt.textContent = shortName(t);
    if (t === state.target) opt.selected = true;
    sel.appendChild(opt);
  }
}

function fillDeviceSelect() {
  const sel = document.getElementById('selDevice');
  sel.innerHTML = '';
  if (!state.targetOpen) {
    sel.innerHTML = '<option value="">— open target first —</option>';
    sel.disabled = true;
    return;
  }
  sel.disabled = false;
  sel.innerHTML = '<option value="">— select device —</option>';
  const listed = new Set();
  for (const d of state.devices) {
    listed.add(d.name);
    const opt = document.createElement('option');
    opt.value = d.name;
    opt.textContent = shortName(d.name) + (d.part ? ' (' + d.part + ')' : '');
    if (d.name === state.device) opt.selected = true;
    sel.appendChild(opt);
  }
  if (state.device && !listed.has(state.device)) {
    const opt = document.createElement('option');
    opt.value = state.device;
    opt.textContent = shortName(state.device);
    opt.selected = true;
    sel.appendChild(opt);
  }
  if (state.device) sel.value = state.device;
}

function updateTargetGatedControls() {
  fillDeviceSelect();
  const needTarget = !state.targetOpen;
  for (const id of ['ltxSelect', 'ltxPath', 'bitSelect', 'bitPath', 'binSelect', 'binPath',
                     'btnLoadLtx', 'btnProgramBit', 'btnProgramBin']) {
    const el = document.getElementById(id);
    if (el) el.disabled = needTarget;
  }
}

const FILE_LIST_CFG = {
  ltx: { url: '/api/ltx', select: 'ltxSelect', path: 'ltxPath', ext: 'ltx', lastKey: 'last_ltx', upload: 'uploadLtx' },
  bit: { url: '/api/bit', select: 'bitSelect', path: 'bitPath', ext: 'bit', lastKey: 'last_bit', upload: 'uploadBit' },
  bin: { url: '/api/bin', select: 'binSelect', path: 'binPath', ext: 'bin', lastKey: 'last_bin', upload: 'uploadBin' },
};

const FOLDER_COLORS = [
  '#4f8cff', '#3ecf8e', '#f0b429', '#c084fc', '#5eead4',
  '#fdba74', '#f472b6', '#38bdf8', '#a3e635', '#fb923c',
];

function folderKey(path) {
  const i = path.lastIndexOf('/');
  return i >= 0 ? path.slice(0, i) : path;
}

function folderColor(folder) {
  let h = 0;
  for (let i = 0; i < folder.length; i++) h = ((h << 5) - h + folder.charCodeAt(i)) | 0;
  return FOLDER_COLORS[Math.abs(h) % FOLDER_COLORS.length];
}

function folderLabel(folder) {
  const marker = '/bin/';
  const idx = folder.indexOf(marker);
  if (idx >= 0) return folder.slice(idx + 1);
  const parts = folder.split('/');
  return parts.length > 2 ? '.../' + parts.slice(-2).join('/') : folder;
}

function basename(path) {
  const i = path.lastIndexOf('/');
  return i >= 0 ? path.slice(i + 1) : path;
}

function siblingLtxPath(bitOrBinPath) {
  if (!bitOrBinPath) return '';
  const i = bitOrBinPath.lastIndexOf('.');
  if (i <= 0) return '';
  return bitOrBinPath.slice(0, i) + '.ltx';
}

function appendFileOption(parent, path, label) {
  const opt = document.createElement('option');
  opt.value = path;
  opt.textContent = label || path;
  opt.title = path;
  opt.style.color = folderColor(folderKey(path));
  parent.appendChild(opt);
}

function appendSeparator(sel) {
  const sep = document.createElement('option');
  sep.disabled = true;
  sep.textContent = '────────────────────────';
  sel.appendChild(sep);
}

function fillFileSelect(sel, all, last, ext) {
  sel.innerHTML = '<option value="">— pick .' + ext + ' file —</option>';
  const sorted = [...all].sort();
  const others = last ? sorted.filter(p => p !== last) : sorted;

  if (last && all.includes(last)) {
    appendFileOption(sel, last, basename(last) + '  (recent)');
  }
  if (last && all.includes(last) && others.length) appendSeparator(sel);

  const byFolder = {};
  for (const p of others) {
    const f = folderKey(p);
    if (!byFolder[f]) byFolder[f] = [];
    byFolder[f].push(p);
  }
  for (const folder of Object.keys(byFolder).sort()) {
    const group = document.createElement('optgroup');
    group.label = folderLabel(folder);
    const color = folderColor(folder);
    group.style.color = color;
    for (const p of byFolder[folder]) {
      appendFileOption(group, p, basename(p));
    }
    sel.appendChild(group);
  }
}

async function rememberFileChoice(kind, path) {
  if (!path) return;
  try {
    await fetch('/api/file_last', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({type: kind, path}),
    });
  } catch (_) { /* best-effort */ }
}

function applyLtxSelection(ltxPath, remember) {
  if (!ltxPath) return;
  document.getElementById('ltxPath').value = ltxPath;
  const ltxSel = document.getElementById('ltxSelect');
  for (const opt of ltxSel.options) {
    if (opt.value === ltxPath) {
      ltxSel.value = ltxPath;
      break;
    }
  }
  if (remember) rememberFileChoice('ltx', ltxPath);
}

async function loadFileList(kind) {
  const cfg = FILE_LIST_CFG[kind];
  if (!cfg) return;
  try {
    const r = await fetch(cfg.url);
    if (!r.ok) {
      setStatus('Could not load .' + cfg.ext + ' file list (HTTP ' + r.status + ')', true);
      return;
    }
    const j = await r.json();
    const sel = document.getElementById(cfg.select);
    if (!sel) return;
    const all = [...new Set([...(j.saved || []), ...(j.candidates || [])])];
    const last = j[cfg.lastKey] || '';
    fillFileSelect(sel, all, last, cfg.ext);
    if (last) {
      document.getElementById(cfg.path).value = last;
      sel.value = last;
    }
  } catch (e) {
    setStatus('Failed to load .' + cfg.ext + ' file list: ' + e, true);
  }
}

async function loadAllFileLists() {
  await Promise.all(Object.keys(FILE_LIST_CFG).map(loadFileList));
}

async function refreshFileList(kind) {
  await loadFileList(kind);
  const ext = FILE_LIST_CFG[kind].ext;
  setStatus('Refreshed .' + ext + ' file list');
}

function triggerUpload(kind) {
  const cfg = FILE_LIST_CFG[kind];
  document.getElementById(cfg.upload).click();
}

async function uploadFile(kind, input) {
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  setStatus('Uploading ' + file.name + '…');
  const fd = new FormData();
  fd.append('file', file);
  fd.append('type', kind);
  try {
    const r = await fetch('/api/upload', { method: 'POST', body: fd });
    const j = await r.json();
    if (!j.success) {
      setStatus('Upload failed: ' + (j.error || ''), true);
      return;
    }
    setStatus('Uploaded to ' + j.path);
    await loadAllFileLists();
    const cfg = FILE_LIST_CFG[kind];
    document.getElementById(cfg.path).value = j.path;
    document.getElementById(cfg.select).value = j.path;
    if (kind === 'bit' || kind === 'bin') {
      const ltx = siblingLtxPath(j.path);
      applyLtxSelection(ltx, !!ltx);
      await loadFileList('ltx');
    }
  } catch (e) {
    setStatus('Upload error: ' + e, true);
  }
}

async function onFileSelect(kind) {
  const cfg = FILE_LIST_CFG[kind];
  const v = document.getElementById(cfg.select).value;
  if (!v) return;
  document.getElementById(cfg.path).value = v;
  await rememberFileChoice(kind, v);
  if (kind === 'bit' || kind === 'bin') {
    const ltx = siblingLtxPath(v);
    applyLtxSelection(ltx, !!ltx);
  }
  await loadFileList(kind);
  if (kind === 'bit' || kind === 'bin') {
    await loadFileList('ltx');
  }
}

async function loadVivadoVersions() {
  const r = await fetch('/api/vivado/versions');
  const j = await r.json();
  const sel = document.getElementById('selVivado');
  sel.innerHTML = '';
  for (const v of (j.versions || [])) {
    const opt = document.createElement('option');
    opt.value = v.path;
    opt.textContent = v.version;
    if (v.path === j.current) opt.selected = true;
    sel.appendChild(opt);
  }
}

async function selectVivado() {
  const path = document.getElementById('selVivado').value;
  setStatus('Switching Vivado…');
  const r = await fetch('/api/vivado/select', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({path}) });
  const j = await r.json();
  setStatus(j.restarted ? 'Vivado restarted — reconnect required' : 'Vivado path saved', !j.success);
  if (j.restarted) { state.connected = false; await refreshTree(); }
  else await refreshTree();
}

async function programDevice(kind) {
  if (!state.targetOpen) { setStatus('Open a target first', true); return; }
  if (!state.device) { setStatus('Select a device first', true); return; }
  const pathId = kind === 'bit' ? 'bitPath' : 'binPath';
  const path = document.getElementById(pathId).value.trim();
  if (!path) { setStatus('Enter a .' + kind + ' file path', true); return; }
  if (!confirm('Program ' + state.device + ' with\\n' + path + '?')) return;
  setStatus('Programming ' + kind.toUpperCase() + '… (this may take several minutes)');
  const r = await fetch('/api/program', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({type: kind, path, device: state.device}),
  });
  const j = await r.json();
  setStatus(
    j.success ? ('Programmed .' + kind + ': ' + shortName(path)) : ('Program failed: ' + (j.detail || j.error || '')),
    !j.success
  );
  if (j.success) {
    await loadAllFileLists();
    await refreshAll();
  }
}

function programBit() { return programDevice('bit'); }
function programBin() { return programDevice('bin'); }

// ---- connect flow ----
function onServerChange() {
  const v = document.getElementById('selServer').value;
  if (v) document.getElementById('serverUrl').value = v;
  state.serverUrl = document.getElementById('serverUrl').value.trim();
}

async function connectFlow() {
  const url = document.getElementById('serverUrl').value.trim() ||
              document.getElementById('selServer').value.trim();
  if (!url) { setStatus('Select or add a server URL', true); return; }
  setStatus('Connecting to ' + url + '…');
  const r = await fetch('/api/hw_servers/connect', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({url})
  });
  const j = await r.json();
  if (!j.success) {
    state.connected = false;
    state.targetOpen = false;
    state.targets = [];
    state.devices = [];
    updateTargetGatedControls();
    renderTree(buildMinimalTree('(not connected)'));
    setStatus('Connect failed — see Tcl console', true);
    return;
  }
  state.connected = true;
  state.serverUrl = url;
  state.targets = j.targets || [];
  state.target = '';
  state.device = '';
  state.devices = [];
  state.targetOpen = false;
  fillServerSelect();
  fillTargetSelect();
  updateTargetGatedControls();
  setStatus('Connected — select a target');
  await refreshTree();
  if (state.targets.length === 1) {
    document.getElementById('selTarget').value = state.targets[0];
    await onTargetChange();
  }
}

async function onTargetChange() {
  const target = document.getElementById('selTarget').value;
  if (!target) return;
  setStatus('Opening target ' + shortName(target) + '…');
  const r = await fetch('/api/targets/open', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({target})
  });
  const j = await r.json();
  if (!j.success) {
    state.targetOpen = false;
    state.devices = [];
    state.device = '';
    updateTargetGatedControls();
    await refreshTree();
    setStatus('Open target failed — see Tcl console', true);
    return;
  }
  state.target = target;
  state.targetOpen = true;
  state.devices = j.devices || [];
  state.device = '';
  updateTargetGatedControls();
  if (state.devices.length === 1) {
    state.device = state.devices[0].name;
    document.getElementById('selDevice').value = state.device;
    await onDeviceChange();
  }
  setStatus('Target open — select a device (' + state.devices.length + ' found)');
  await refreshTree();
}

async function loadDeviceData() {
  if (!state.device) return;
  await Promise.all([
    refreshViosOnly(),
    refreshXadcOnly(),
    loadProperties(state.device),
  ]);
  document.getElementById('propsTime').textContent = 'Updated ' + new Date().toLocaleTimeString();
  syncPollers();
}

async function onDeviceChange() {
  if (!state.targetOpen) {
    setStatus('Open a target before selecting a device', true);
    state.device = '';
    document.getElementById('selDevice').value = '';
    return;
  }
  state.device = document.getElementById('selDevice').value;
  if (!state.device) return;
  lastVioValues = {};
  lastXadcValues = {};
  lastPropValues = {};
  resetXadcPlots();
  await fetch('/api/devices/' + encodeURIComponent(state.device) + '/select', {method:'POST'});
  await loadDeviceData();
  highlightTreeSelection();
}

async function applyLtx() {
  const path = document.getElementById('ltxPath').value.trim();
  if (!path) { setStatus('Enter an .ltx file path', true); return; }
  if (!state.targetOpen) { setStatus('Open a target first', true); return; }
  if (!state.device) { setStatus('Select a device first', true); return; }
  setStatus('Loading LTX…');
  const r = await fetch('/api/ltx', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({path, device: state.device})
  });
  const j = await r.json();
  setStatus(j.success ? 'LTX loaded: ' + shortName(path) : ('LTX failed: ' + (j.error||'')), !j.success);
  if (j.success) { await loadAllFileLists(); await refreshTree(); await refreshAll(); }
}

// ---- tree ----
function vivadoTreeLabel() {
  const sel = document.getElementById('selVivado');
  return sel && sel.selectedOptions.length ? sel.selectedOptions[0].textContent : 'Vivado';
}

function buildMinimalTree(serverLabel) {
  return {
    type: 'vivado',
    name: vivadoTreeLabel(),
    full: '',
    children: [{
      type: 'server',
      name: serverLabel || '(not connected)',
      full: '',
      children: [],
    }],
  };
}

function renderTree(tree) {
  const wrap = document.getElementById('hwTree');
  if (!tree) {
    wrap.innerHTML = '<p class="empty">Not connected</p>';
    return;
  }

  function nodeEl(n) {
    const div = document.createElement('div');
    div.className = 'tree-node ' + n.type + (isActive(n) ? ' active' : '');
    const icons = {
      vivado: '⚙', server: '🖧', target: '🎯', device: '🔲', vio: '📊', sysmon: '🌡',
    };
    let label = n.name;
    if (n.type === 'device' && n.part) label += ' (' + n.part + ')';
    div.innerHTML = '<span class="icon">' + (icons[n.type] || '·') + '</span><span>' + esc(label) + '</span>';
    div.title = n.full || n.name;
    div.onclick = (ev) => { ev.stopPropagation(); onTreeClick(n); };
    return div;
  }

  function isActive(n) {
    if (n.type === 'server') return state.connected && n.full === state.serverUrl;
    if (n.type === 'device') return n.full === state.device;
    if (n.type === 'target') return n.full === state.target;
    return false;
  }

  wrap.innerHTML = '';
  const frag = document.createDocumentFragment();

  function walk(n) {
    frag.appendChild(nodeEl(n));
    for (const c of (n.children || [])) walk(c);
  }
  walk(tree);
  wrap.appendChild(frag);
}

function highlightTreeSelection() {
  document.querySelectorAll('.tree-node').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tree-node.device').forEach(el => {
    if (el.textContent.includes(shortName(state.device))) el.classList.add('active');
  });
}

async function onTreeClick(n) {
  if (n.type === 'target' && n.full) {
    document.getElementById('selTarget').value = n.full;
    await onTargetChange();
  } else if (n.type === 'device' && n.full) {
    if (!state.targetOpen) {
      setStatus('Open a target before selecting a device', true);
      return;
    }
    document.getElementById('selDevice').value = n.full;
    await onDeviceChange();
  } else if (n.type === 'vio') {
    switchTab('vio');
  } else if (n.type === 'sysmon') {
    if (!state.targetOpen) {
      setStatus('Open a target first', true);
      return;
    }
    switchTab('xadc');
    if (n.full) {
      document.getElementById('selDevice').value = n.full;
      await onDeviceChange();
    }
  }
}

function isValidServerUrl(url) {
  return url && !/^WARNING:/i.test(url) && !/no matching hw_servers/i.test(url);
}

function isValidTargetPath(t) {
  return t && t.includes('/') && !t.includes(' ');
}

async function refreshTree() {
  try {
    const r = await fetch('/api/tree');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();

    if (typeof j.connected === 'boolean') state.connected = j.connected;

    if (isValidServerUrl(j.server_url) && state.connected) {
      state.serverUrl = j.server_url;
    }

    state.targets = (j.targets || []).filter(isValidTargetPath);

    if (j.devices && j.devices.length) {
      state.devices = j.devices;
    } else if (!state.connected) {
      state.devices = [];
    }

    if (!state.connected) {
      state.targetOpen = false;
      state.target = '';
      state.device = '';
      state.targets = [];
      state.devices = [];
    } else {
      if (j.last_target && !state.target) state.target = j.last_target;
      if (j.last_device && !state.device) state.device = j.last_device;
      if (typeof j.target_open === 'boolean') {
        state.targetOpen = j.target_open;
      }
    }

    fillTargetSelect();
    updateTargetGatedControls();

    if (j.error) setStatus(String(j.error), true);

    if (!state.connected) {
      renderTree(buildMinimalTree('(not connected)'));
      return;
    }
    renderTree(j.tree || buildMinimalTree(state.serverUrl || '(connected)'));
  } catch (e) {
    state.connected = false;
    state.targetOpen = false;
    state.target = '';
    state.device = '';
    state.targets = [];
    state.devices = [];
    fillTargetSelect();
    updateTargetGatedControls();
    renderTree(buildMinimalTree('(unavailable)'));
    setStatus('Hardware tree refresh failed: ' + e, true);
  }
}

// ---- monitoring ----
function renderVios(vios) {
  const wrap = document.getElementById('vioWrap');
  if (!vios || !Object.keys(vios).length) {
    wrap.innerHTML = '<p class="empty">No VIO probes. Load an .ltx file or program a bitstream with VIO cores.</p>';
    return;
  }
  let html = '<table class="data"><tr><th>VIO core</th><th>Probe</th><th>Dir</th><th>Value</th><th>Activity</th></tr>';
  for (const [vio, probes] of Object.entries(vios)) {
    html += '<tr class="group"><td colspan="5">' + esc(vio) + '</td></tr>';
    for (const p of probes) {
      const key = vio + '|' + p.probe;
      const changed = lastVioValues[key] !== undefined && lastVioValues[key] !== p.value;
      lastVioValues[key] = p.value;
      const act = p.activity || '-';
      const actLive = act !== '-' && act !== '0' && act !== '0x0' && act !== '0X0';
      html += '<tr><td></td><td>' + esc(p.probe) + '</td>' +
        '<td class="dir-' + p.direction + '">' + p.direction + '</td>' +
        '<td class="' + (changed ? 'val-changed' : '') + '">' + esc(p.value) + '</td>' +
        '<td class="' + (actLive ? 'act-live' : 'act-idle') + '" title="Input probe transitions since last refresh">' +
        esc(act) + '</td></tr>';
    }
  }
  html += '</table>';
  wrap.innerHTML = html;
}

function deviceQuery() {
  return state.device ? '?device=' + encodeURIComponent(state.device) : '';
}

function isXadcHighlight(prop) {
  if (prop === 'TEMPERATURE' || prop.endsWith('_TEMPERATURE') || /^(LOWER_OT|UPPER_OT)/.test(prop)) return 'temp';
  if (/^(VCC|VUSER|VAUX|MAX_|MIN_|LOWER_|UPPER_)/.test(prop)) return 'volt';
  return '';
}

function formatXadcValue(prop, value) {
  if (prop.endsWith('_SCALE')) return value;
  const v = parseFloat(value);
  if (isNaN(v)) return value;
  if (prop.includes('TEMPERATURE') || /^(LOWER_OT|UPPER_OT)/.test(prop)) return v.toFixed(1) + ' °C';
  if (/^VCC|^VUSER|^VAUX|^MAX_V|^MIN_V|^LOWER_V|^UPPER_V/.test(prop)) return v.toFixed(3) + ' V';
  return value;
}

function isXadcLimitProp(prop) {
  return /^(MAX_|MIN_|LOWER_|UPPER_)/.test(prop);
}

function isXadcTempVar(prop) {
  if (prop.endsWith('_SCALE') || prop.endsWith('_OFFSET')) return false;
  if (prop === 'MAX_TEMPERATURE' || prop === 'MIN_TEMPERATURE') return true;
  if (/^(LOWER_|UPPER_)/.test(prop)) return false;
  if (/^(MAX_|MIN_)/.test(prop)) return false;
  return prop === 'TEMPERATURE' || prop.includes('TEMPERATURE');
}

function isXadcVoltVar(prop) {
  if (prop.endsWith('_SCALE') || prop.endsWith('_OFFSET')) return false;
  if (/^(MAX_|MIN_|LOWER_|UPPER_)/.test(prop)) return false;
  return /^(VCC|VUSER|VAUX)/.test(prop);
}

function isXadcMeasurementsTable(prop) {
  if (prop.includes('TEMPERATURE') || prop === 'TEMPERATURE') return true;
  if (/^(LOWER_OT|UPPER_OT)/.test(prop)) return true;
  if (/^(VCC|VUSER|VAUX|MAX_V|MIN_V|LOWER_V|UPPER_V)/.test(prop)) return true;
  return false;
}

function parseXadcNumeric(prop, value) {
  if (prop.endsWith('_SCALE')) return NaN;
  const v = parseFloat(value);
  return isNaN(v) ? NaN : v;
}

function xadcChartOptions(yLabel) {
  const muted = '#8b9bb4';
  const grid = '#2a3654';
  return {
    responsive: true,
    maintainAspectRatio: false,
    animation: false,
    interaction: { mode: 'nearest', intersect: false },
    scales: {
      x: {
        type: 'time',
        time: {
          displayFormats: { second: 'HH:mm:ss', minute: 'HH:mm:ss', hour: 'HH:mm' },
          tooltipFormat: 'HH:mm:ss',
        },
        title: { display: true, text: 'Time', color: muted, font: { size: 10 } },
        ticks: { color: muted, maxTicksLimit: 8, font: { size: 9 }, autoSkip: true },
        grid: { color: grid },
      },
      y: {
        title: { display: true, text: yLabel, color: muted, font: { size: 10 } },
        ticks: { color: muted, font: { size: 9 } },
        grid: { color: grid },
      },
    },
    plugins: {
      legend: {
        display: true,
        position: 'bottom',
        labels: { color: muted, boxWidth: 10, font: { size: 9 }, padding: 6 },
      },
      tooltip: {
        callbacks: {
          title(items) {
            if (!items.length) return '';
            return new Date(items[0].parsed.x).toLocaleTimeString();
          },
          label(ctx) {
            const unit = yLabel === '°C' ? ' °C' : ' V';
            return ctx.dataset.label + ': ' + ctx.parsed.y.toFixed(3) + unit;
          },
        },
      },
    },
  };
}

function destroyXadcCharts() {
  for (const key of ['temp', 'volt']) {
    if (xadcCharts[key]) {
      xadcCharts[key].destroy();
      xadcCharts[key] = null;
    }
  }
}

function resetXadcPlots() {
  xadcHist = { temp: {}, volt: {} };
  xadcLegendFilter = { temp: null, volt: null };
  destroyXadcCharts();
}

function applyLegendFilter(chart, key) {
  if (!chart) return;
  const filter = xadcLegendFilter[key];
  chart.data.datasets.forEach(ds => {
    ds.hidden = filter !== null && ds.label !== filter;
  });
}

function bindLegendIsolate(chart, key) {
  if (!chart || chart._legendIsolateBound) return;
  chart._legendIsolateBound = true;
  chart.canvas.addEventListener('dblclick', (evt) => {
    const legend = chart.legend;
    if (!legend || !legend.legendHitBoxes) return;
    const rect = chart.canvas.getBoundingClientRect();
    const x = evt.clientX - rect.left;
    const y = evt.clientY - rect.top;
    let hitLabel = null;
    legend.legendHitBoxes.forEach((box, i) => {
      if (x >= box.left && x <= box.left + box.width && y >= box.top && y <= box.top + box.height) {
        const item = legend.legendItems[i];
        if (item) hitLabel = item.text;
      }
    });
    if (!hitLabel) return;
    xadcLegendFilter[key] = xadcLegendFilter[key] === hitLabel ? null : hitLabel;
    applyLegendFilter(chart, key);
    chart.update('none');
  });
}

function ensureXadcCharts() {
  if (typeof Chart === 'undefined') return;
  if (!xadcCharts.temp) {
    const ctx = document.getElementById('xadcTempChart');
    if (!ctx) return;
    xadcCharts.temp = new Chart(ctx, {
      type: 'line',
      data: { datasets: [] },
      options: xadcChartOptions('°C'),
    });
    bindLegendIsolate(xadcCharts.temp, 'temp');
  }
  if (!xadcCharts.volt) {
    const ctx = document.getElementById('xadcVoltChart');
    if (!ctx) return;
    xadcCharts.volt = new Chart(ctx, {
      type: 'line',
      data: { datasets: [] },
      options: xadcChartOptions('V'),
    });
    bindLegendIsolate(xadcCharts.volt, 'volt');
  }
}

function syncChartDatasets(chart, hist, key) {
  if (!chart) return;
  const props = Object.keys(hist).sort();

  chart.data.datasets = props.map((prop, idx) => {
    const color = XADC_PLOT_COLORS[idx % XADC_PLOT_COLORS.length];
    const points = hist[prop] || [];
    return {
      label: prop,
      data: points,
      borderColor: color,
      backgroundColor: color + '33',
      borderWidth: 1.5,
      pointRadius: 0,
      pointHitRadius: 6,
      tension: 0.15,
      fill: false,
    };
  });

  applyLegendFilter(chart, key);
  chart.update('none');
}

function appendXadcHistory(readings) {
  const ts = Date.now();
  for (const r of readings) {
    const v = parseXadcNumeric(r.property, r.value);
    if (isNaN(v)) continue;
    let bucket = null;
    if (isXadcTempVar(r.property)) bucket = xadcHist.temp;
    else if (isXadcVoltVar(r.property)) bucket = xadcHist.volt;
    else continue;

    if (!bucket[r.property]) bucket[r.property] = [];
    bucket[r.property].push({ x: ts, y: v });
    if (bucket[r.property].length > XADC_HIST_MAX) bucket[r.property].shift();
  }
}

function updateXadcCharts() {
  ensureXadcCharts();
  syncChartDatasets(xadcCharts.temp, xadcHist.temp, 'temp');
  syncChartDatasets(xadcCharts.volt, xadcHist.volt, 'volt');
}

function buildXadcTableRows(readings) {
  let rows = '';
  for (const r of readings) {
    const key = r.property + '|' + r.device;
    const changed = lastXadcValues[key] !== undefined && lastXadcValues[key] !== r.value;
    lastXadcValues[key] = r.value;
    const hl = isXadcHighlight(r.property);
    rows += '<tr class="' + (hl ? 'xadc-highlight ' + hl : '') + (changed ? ' val-changed' : '') + '">' +
      '<td>' + esc(r.property) + '</td>' +
      '<td class="value">' + esc(formatXadcValue(r.property, r.value)) + '</td></tr>';
  }
  return rows;
}

function renderXadc(readings) {
  const wrap = document.getElementById('xadcTableWrap');
  if (!readings || !readings.length) {
    wrap.innerHTML = '<p class="empty">No System Monitor data. Select a device with an open target.</p>';
    resetXadcPlots();
    return;
  }
  appendXadcHistory(readings);
  const sorted = readings.slice().sort((a, b) => a.property.localeCompare(b.property));
  const primary = sorted.filter(r => isXadcMeasurementsTable(r.property));
  const other = sorted.filter(r => !isXadcMeasurementsTable(r.property));
  const tableHead = '<table class="data"><tr><th>Property</th><th>Value</th></tr>';
  let html = '<h4 class="xadc-section-title">Temperature &amp; Voltages (' + primary.length + ')</h4>';
  html += tableHead + buildXadcTableRows(primary) + '</table>';
  html += '<h4 class="xadc-section-title">Registers (' + other.length + ')</h4>';
  html += tableHead + buildXadcTableRows(other) + '</table>';
  wrap.innerHTML = html;
  updateXadcCharts();
}

async function refreshViosOnly() {
  if (!state.targetOpen) return;
  try {
    const r = await fetch('/api/vios' + deviceQuery());
    const j = await r.json();
    document.getElementById('vioTime').textContent = 'Updated ' + new Date().toLocaleTimeString();
    renderVios(j.vios);
  } catch (e) {
    setStatus('VIO refresh error: ' + e, true);
  }
}

async function refreshXadcOnly() {
  if (!state.targetOpen) return;
  try {
    const r = await fetch('/api/xadc' + deviceQuery());
    const j = await r.json();
    document.getElementById('xadcTime').textContent =
      'Updated ' + new Date().toLocaleTimeString() + ' (' + (j.readings || []).length + ' props)';
    renderXadc(j.readings);
  } catch (e) {
    setStatus('XADC refresh error: ' + e, true);
  }
}

async function refreshPropertiesOnly() {
  if (!state.targetOpen || !state.device) return;
  await loadProperties(state.device);
  document.getElementById('propsTime').textContent = 'Updated ' + new Date().toLocaleTimeString();
}

function stopPoller(key) {
  if (pollTimers[key]) {
    clearInterval(pollTimers[key]);
    pollTimers[key] = null;
  }
  if (pollLoops[key]) {
    pollLoops[key].running = false;
    pollLoops[key] = null;
  }
}

function startContinuousPoll(key, fn) {
  pollLoops[key] = { running: true };
  (async () => {
    while (pollLoops[key] && pollLoops[key].running) {
      if (!pollBusy[key]) {
        pollBusy[key] = true;
        try {
          await fn();
        } catch (_) { /* keep looping */ }
        pollBusy[key] = false;
      }
      await new Promise(r => setTimeout(r, 50));
    }
  })();
}

function syncPollers() {
  syncPoller('vio', refreshViosOnly);
  syncPoller('xadc', refreshXadcOnly);
  syncPoller('props', refreshPropertiesOnly);
}

function syncPoller(key, fn) {
  stopPoller(key);
  const sel = document.getElementById(POLL_SELECT[key]);
  if (!sel) return;
  const rate = sel.value;
  if (!rate || rate === 'off') return;
  const needsDevice = key === 'props';
  if (!state.targetOpen || (needsDevice && !state.device)) return;

  if (rate === '0') {
    startContinuousPoll(key, fn);
    return;
  }
  const ms = parseInt(rate, 10) * 1000;
  if (ms > 0) pollTimers[key] = setInterval(fn, ms);
}

function stopAllPollers() {
  for (const key of Object.keys(POLL_SELECT)) stopPoller(key);
}

function renderProperties(properties) {
  const wrap = document.getElementById('propsWrap');
  if (!properties || !properties.length) {
    wrap.innerHTML = '<p class="empty">No properties returned.</p>';
    return;
  }
  const sorted = properties.slice().sort((a, b) => a.name.localeCompare(b.name));
  let html = '<table class="data"><tr><th>Property</th><th>Value</th></tr>';
  for (const p of sorted) {
    const changed = lastPropValues[p.name] !== undefined && lastPropValues[p.name] !== p.value;
    lastPropValues[p.name] = p.value;
    html += '<tr class="' + (changed ? 'val-changed' : '') + '">' +
      '<td>' + esc(p.name) + '</td>' +
      '<td class="value" style="font-family:var(--mono);font-size:.74rem">' + esc(p.value) + '</td></tr>';
  }
  html += '</table>';
  wrap.innerHTML = html;
}

async function loadProperties(device) {
  const r = await fetch('/api/devices/' + encodeURIComponent(device) + '/properties');
  const j = await r.json();
  if (!j.success) {
    const wrap = document.getElementById('propsWrap');
    if (!wrap.querySelector('table')) {
      wrap.innerHTML = '<p class="empty">Failed to load properties.</p>';
    }
    return;
  }
  renderProperties(j.properties);
}

async function refreshAll() {
  if (!state.targetOpen) {
    setStatus('Open a target to refresh monitoring data', true);
    return;
  }
  try {
    await refreshViosOnly();
    await refreshXadcOnly();
    if (state.device) await refreshPropertiesOnly();
    await refreshTree();
    if (state.targetOpen && state.device) syncPollers();
  } catch (e) {
    setStatus('Refresh error: ' + e, true);
  }
}

async function disconnect() {
  stopAllPollers();
  lastVioValues = {};
  lastXadcValues = {};
  lastPropValues = {};
  resetXadcPlots();
  state.connected = false;
  state.targets = [];
  state.devices = [];
  state.target = '';
  state.device = '';
  state.targetOpen = false;
  fillTargetSelect();
  updateTargetGatedControls();
  renderTree(buildMinimalTree('(not connected)'));
  document.getElementById('vioWrap').innerHTML = '<p class="empty">Disconnected.</p>';
  document.getElementById('xadcTableWrap').innerHTML = '<p class="empty">Disconnected.</p>';
  document.getElementById('propsWrap').innerHTML = '<p class="empty">Disconnected.</p>';
  try {
    await fetch('/api/disconnect', {method:'POST'});
  } catch (_) { /* still show clean UI */ }
  setStatus('Disconnected');
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ---- terminal ----
async function loadTclHistory() {
  try {
    const r = await fetch('/api/tcl/history');
    const j = await r.json();
    tclHistory = j.history || [];
  } catch (_) {
    tclHistory = [];
  }
}

function resetTclHistBrowse() {
  tclHistPos = -1;
  tclDraft = '';
}

async function pollConsole() {
  try {
    const r = await fetch('/api/console?after=' + consoleCursor);
    const j = await r.json();
    if (j.entries && j.entries.length) {
      const term = document.getElementById('terminal');
      for (const e of j.entries) {
        const cmd = document.createElement('div');
        cmd.className = 'term-cmd';
        cmd.textContent = '[' + e.ts + '] vivado% ' + e.cmd;
        term.appendChild(cmd);
        if (e.output) {
          const out = document.createElement('div');
          out.className = e.success ? 'term-out' : 'term-err';
          out.textContent = e.output;
          term.appendChild(out);
        }
      }
      consoleCursor = j.last_id;
      term.scrollTop = term.scrollHeight;
      updateTermHeadHint('(' + j.last_id + ' cmds)');
    }
  } catch (_) {}
}
setInterval(pollConsole, 800);

document.getElementById('termInput').addEventListener('keydown', async (ev) => {
  const input = ev.target;

  if (ev.key === 'ArrowUp') {
    ev.preventDefault();
    if (tclHistory.length === 0) return;
    if (tclHistPos === -1) tclDraft = input.value;
    tclHistPos = Math.min(tclHistPos + 1, tclHistory.length - 1);
    input.value = tclHistory[tclHistory.length - 1 - tclHistPos];
    return;
  }

  if (ev.key === 'ArrowDown') {
    ev.preventDefault();
    if (tclHistPos <= 0) {
      resetTclHistBrowse();
      input.value = tclDraft;
      return;
    }
    tclHistPos--;
    input.value = tclHistory[tclHistory.length - 1 - tclHistPos];
    return;
  }

  if (ev.key !== 'Enter') {
    if (tclHistPos !== -1) resetTclHistBrowse();
    return;
  }

  const cmd = input.value.trim();
  if (!cmd) return;
  input.value = '';
  resetTclHistBrowse();
  const r = await fetch('/api/tcl', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({cmd}),
  });
  const j = await r.json();
  if (j.history) tclHistory = j.history;
  pollConsole();
});

// ---- restore session ----
async function restoreSession() {
  const r = await fetch('/api/session/hw_state');
  const j = await r.json();
  if (j.saved_hw_servers) state.servers = j.saved_hw_servers;
  fillServerSelect();
  if (j.server_url) {
    state.serverUrl = j.server_url;
    document.getElementById('selServer').value = j.server_url;
    document.getElementById('serverUrl').value = j.server_url;
  }
  if (!j.connected) return;
  state.connected = true;
  state.targets = j.targets || [];
  state.devices = j.devices || [];
  if (j.last_target) state.target = j.last_target;
  if (j.last_device) state.device = j.last_device;
  state.targetOpen = !!j.target_open;
  fillTargetSelect();
  updateTargetGatedControls();
  if (state.target) document.getElementById('selTarget').value = state.target;
  if (state.device && state.targetOpen) document.getElementById('selDevice').value = state.device;
  setStatus('Session restored — ' + (j.server_url || ''));
  if (state.target && !state.targetOpen) {
    await onTargetChange();
  } else {
    await refreshTree();
    if (state.device && state.targetOpen) await loadDeviceData();
  }
}

// ---- init ----
loadVivadoVersions();
fillServerSelect();
updateTargetGatedControls();
loadAllFileLists();
loadTclHistory();
refreshTree();
restoreSession();
pollConsole();
</script>
